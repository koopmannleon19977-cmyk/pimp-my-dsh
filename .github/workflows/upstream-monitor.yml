name: Upstream pin monitor

on:
  schedule:
    - cron: '30 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: inspect published upstream pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820021 # v4
        with:
          node-version: 24
      - name: Check npm registry pins
        run: node scripts/check-upstream-pin.mjs
