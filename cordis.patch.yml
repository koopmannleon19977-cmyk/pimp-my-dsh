# pimp-my-dsh bundle layer for @deepseek-ai/dsh 0.1.0-rc.6.
# A DSH patch replaces a targeted row's whole config; every override below
# therefore restates the complete configuration owned by this distribution.

- id: llm-pi-ai
  config:
    providers:
      pimp-openai:
        displayName: Pimp OpenAI-compatible
        apiKeyEnv: DSH_PIMP_API_KEY
        api: openai-responses
        baseURL: !!js process.env.DSH_PIMP_BASE_URL ?? 'https://api.openai.com/v1'
        models:
          - id: !!js process.env.DSH_PIMP_MODEL ?? 'gpt-5.4'
            name: !!js process.env.DSH_PIMP_MODEL ?? 'gpt-5.4'
            contextWindow: 262144
            maxTokens: 32768

- id: agent-default-model
  config:
    provider: pimp-openai
    model: !!js process.env.DSH_PIMP_MODEL ?? 'gpt-5.4'

# Bound every model-emitted parallel-safe tool group. Native sibling subagent
# calls share this rolling pool and commit their tool results in model order.
- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 4

# Pin the native fresh-child provider and continuable background route instead
# of relying on upstream defaults that may move during developer preview.
- id: subagent-spawn-in-process
  config:
    providerName: spawn

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 3

# Hard-disabled. DSH_TELEMETRY_MODE cannot reactivate this row.
- id: session-telemetry-otel
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-index.sqlite')
    openAt: first-search

# The Windows ACL restricted-token backend reports `partial` enforcement:
# filesystem writes are constrained, while network/process visibility are not.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: ask

- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: ask

# Restate upstream platform gates explicitly: Windows receives only the
# PowerShell stack; POSIX receives only Bash.
- id: bash-sandbox
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000


- id: pwsh-sandbox
  disabled: !!js process.platform !== 'win32'

- id: tool-bash
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  disabled: !!js process.platform !== 'win32'

# Both model-facing web tools stay disabled. The upstream HTTP fetch provider
# is not mounted because it does not block private-network SSRF.
- id: tool-web
  config:
    search: false
    fetch: false

- insert:
    - id: pimp-my-dsh
      name: pimp-my-dsh

    # One-shot fresh child in a unique retained Git worktree. The distribution
    # provider creates the workspace; active use is approval-gated.
    - id: tool-subagent-worktree
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: worktree
        toolName: subagent_worktree
        backgroundMode: one-shot
        maxDepth: 3

    # Official Playwright MCP in a fresh in-memory Chrome profile. It receives
    # the MCP client's credential-scrubbed environment and is explicit opt-in.
    - id: mcp-browser
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process.env.DSH_PIMP_ENABLE_BROWSER !== '1'
      config:
        serverName: browser
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.env.DSH_PIMP_BROWSER_CLI
          - --browser
          - chrome
          - --headless
          - --isolated
          - --block-service-workers
          - --image-responses
          - omit
          - --codegen
          - none
          - --output-dir
          - !!js dshHomePath('browser-output')
          - --output-max-size
          - '104857600'
          - --timeout-action
          - '10000'
          - --timeout-navigation
          - '60000'
        toolCallTimeoutMs: 70000
        failOnStartupError: true

    # Curated default docs MCP: Context7 over streamable HTTP. Fixed host,
    # no local code, no key required (the optional key raises rate limits).
    # Preconfigured but opt-in like every external surface; outage-tolerant.
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process.env.DSH_PIMP_ENABLE_CONTEXT7 !== '1'
      config:
        serverName: context7
        transport: streamable-http
        url: 'https://mcp.context7.com/mcp'
        headers: !!js "process.env.DSH_PIMP_CONTEXT7_KEY ? { authorization: 'Bearer ' + process.env.DSH_PIMP_CONTEXT7_KEY } : {}"
        toolCallTimeoutMs: 60000
        failOnStartupError: false

    # LSP servers are trusted local processes and receive no DSH sandbox.
    # All three rows remain dormant unless the operator explicitly opts in.
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'
      disabled: !!js process.env.DSH_PIMP_ENABLE_LSP !== '1'

    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      disabled: !!js process.env.DSH_PIMP_ENABLE_LSP !== '1'
      config:
        servers:
          typescript:
            command: typescript-language-server
            args: [--stdio]
            extensionToLanguage:
              .ts: typescript
              .tsx: typescriptreact
              .js: javascript
              .jsx: javascriptreact
          pyright:
            command: pyright-langserver
            args: [--stdio]
            extensionToLanguage:
              .py: python

    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'
      disabled: !!js process.env.DSH_PIMP_ENABLE_LSP !== '1'
      config:
        maxLocations: 100
        maxResultChars: 16000
        timeoutMs: 60000
